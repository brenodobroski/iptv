<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#09090b">
    
    <title>Meu IPTV Premium</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <style>
        :root {
            --bg-base: #09090b; 
            --bg-sidebar: #121214;
            --bg-card: #18181b;
            --accent: #3b82f6; 
            --accent-hover: #2563eb;
            --event-color: #ef4444; 
            --history-color: #10b981; 
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --border-light: rgba(255, 255, 255, 0.1);
            --star-color: #ffffff;
            --star-active: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; flex-direction: row; }
        
        /* TELA DE LOGIN */
        #login-screen { position: fixed; inset: 0; background: var(--bg-base); z-index: 9999; display: flex; align-items: center; justify-content: center; background-image: radial-gradient(circle at top right, #1e293b, #09090b); }
        .login-card { background: var(--bg-card); padding: 40px; border-radius: 16px; width: 90%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); border: 1px solid var(--border-light); display: flex; flex-direction: column; gap: 15px; }
        .login-card .logo { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 28px; font-weight: 800; margin-bottom: 5px; }
        .login-card .logo img { width: 36px; height: 36px; border-radius: 8px; }
        .login-card .logo span { color: var(--accent); }
        .login-card p { color: var(--text-muted); text-align: center; font-size: 14px; margin-top: -10px; margin-bottom: 20px; }
        .login-input-group { display: flex; flex-direction: column; gap: 6px; }
        .login-input-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .login-input { background: #09090b; border: 1px solid var(--border-light); color: white; padding: 14px 15px; border-radius: 8px; outline: none; font-size: 14px; transition: 0.2s; }
        .login-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .btn-login { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 16px; margin-top: 15px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-login:hover { background: var(--accent-hover); transform: translateY(-2px); }

        /* MENU LATERAL DE ÍCONES */
        #left-nav { width: 70px; min-width: 70px; background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 100%); display: flex; flex-direction: column; align-items: center; padding: 30px 0; gap: 30px; z-index: 1000; border-right: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(5px); }
        .nav-icon { background: transparent; border: none; color: var(--text-muted); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; position: relative; }
        .nav-icon svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-icon:hover { color: white; transform: scale(1.1); }
        .nav-icon.active { color: var(--bg-base); background: white; box-shadow: 0 0 15px rgba(255,255,255,0.4); }
        .nav-spacer { flex-grow: 1; }

        /* SIDEBAR DE CATEGORIAS */
        #sidebar { width: 260px; min-width: 260px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border-light); z-index: 50; transition: width 0.3s, min-width 0.3s, padding 0.3s, opacity 0.3s; }
        #sidebar.hidden { width: 0; min-width: 0; opacity: 0; overflow: hidden; border: none; }
        
        .logo { padding: 25px 20px; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; gap: 10px; white-space: nowrap; }
        .logo span { color: var(--accent); }
        
        .search-container { padding: 15px; }
        .search-box-wrapper { display: flex; align-items: center; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px 15px; border: 1px solid var(--border-light); transition: 0.2s; width: 100%; }
        .search-box-wrapper:focus-within { border-color: white; background: rgba(0,0,0,0.5); }
        .search-box-wrapper svg { width: 16px; height: 16px; fill: var(--text-muted); margin-right: 10px; flex-shrink: 0; }
        .search-box-wrapper input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 13px; }
        .sidebar-title { padding: 10px 20px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: bold; }
        
        #category-list { list-style: none; overflow-y: auto; flex-grow: 1; padding: 0 10px 20px 10px; margin: 0; }
        #category-list li { padding: 10px 15px; margin-bottom: 4px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-size: 13px; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; justify-content: space-between;}
        #category-list li:hover { background: rgba(255,255,255,0.05); color: white; }
        #category-list li.active { background: rgba(255,255,255,0.1); color: white; font-weight: 600; border-left: 3px solid white; border-radius: 0 8px 8px 0; }
        .badge-count { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 12px; font-size: 11px; }

        /* MAIN AREA */
        #main-area { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; background: var(--bg-base); }
        .view-section { display: none; flex-direction: column; flex-grow: 1; overflow-y: auto; padding: 0; scroll-behavior: smooth; position: absolute; inset: 0; }
        .view-section.active { display: flex; }

        /* HERO BANNER */
        .hero-slider { position: relative; height: 75vh; min-height: 500px; overflow: hidden; margin-bottom: -40px; background: #000; }
        .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; display: flex; align-items: flex-end; padding: 0 60px 100px 60px; cursor: pointer; }
        .hero-slide.active { opacity: 1; z-index: 2; }
        .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: top center; z-index: 0; transition: transform 10s linear; mask-image: linear-gradient(to top, transparent 0%, black 60%); -webkit-mask-image: linear-gradient(to top, transparent 0%, black 60%); opacity: 0.8; }
        .hero-slide.active .hero-bg { transform: scale(1.03); }
        .hero-overlay-gradient { position: absolute; inset: 0; background: linear-gradient(to right, var(--bg-base) 0%, transparent 60%); z-index: 1; }
        
        .hero-content { position: relative; z-index: 2; max-width: 700px; display: flex; flex-direction: column; }
        .hero-title { font-size: 48px; font-weight: 900; line-height: 1.1; margin-bottom: 10px; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        .hero-logo { max-width: 400px; max-height: 150px; object-fit: contain; margin-bottom: 15px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8)); }
        
        .hero-meta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; align-items: center;}
        .hero-meta-badge { background: transparent; border: 1px solid rgba(255,255,255,0.3); padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; color: #d4d4d8; display: flex; align-items: center; gap: 6px; }
        
        .slider-controls { position: absolute; bottom: 60px; right: 60px; z-index: 10; display: flex; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: 0.3s; }
        .dot.active { background: white; width: 24px; border-radius: 10px; }

        /* SCROLLERS DA HOME */
        .home-content-wrapper { padding: 0 0 60px 0; position: relative; z-index: 10; }
        .home-row { margin-bottom: 30px; }
        .home-row h3 { font-size: 18px; font-weight: 700; margin-bottom: 10px; margin-left: 60px; display: flex; align-items: center; gap: 10px; color: white; }
        
        .scroller-container { position: relative; display: flex; align-items: center; width: 100%; }
        .scroller-container:hover .scroll-btn { opacity: 1; }
        .scroll-btn { position: absolute; z-index: 20; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.2); color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: 0.3s; top: 50%; transform: translateY(-50%); backdrop-filter: blur(5px); }
        .scroll-btn:hover { background: white; color: black; transform: translateY(-50%) scale(1.1); }
        .scroll-btn svg { width: 26px; height: 26px; fill: currentColor; }
        .scroll-btn.hidden-btn { display: none !important; }
        .left-btn { left: 15px; }
        .right-btn { right: 15px; }

        .row-scroller { display: flex; gap: 15px; overflow-x: auto; overflow-y: hidden; padding: 15px 60px 40px 60px; scroll-snap-type: x mandatory; scroll-padding-left: 60px; scrollbar-width: none; width: 100%; }
        .row-scroller::-webkit-scrollbar { display: none; }
        
        /* ESTILO DO "TOP 10" COM NÚMEROS GIGANTES */
        .numbered-item { position: relative; display: flex; align-items: center; padding-left: 45px; margin-right: 20px; scroll-snap-align: start; cursor: pointer; }
        .huge-number { position: absolute; left: 0; bottom: -20px; font-size: 170px; font-weight: 900; color: transparent; -webkit-text-stroke: 2px #3f3f46; z-index: 0; line-height: 0.8; font-family: Arial, Helvetica, sans-serif; letter-spacing: -10px; transition: all 0.3s ease; pointer-events: none; }
        .numbered-item:hover .huge-number { -webkit-text-stroke: 2px white; }
        .numbered-item .media-card { z-index: 1; min-width: 140px; max-width: 140px; border-radius: 8px; }
        .numbered-item .card-info { display: none; }

        /* CARDS PADRÃO E DE EPISÓDIOS */
        .media-card { background: transparent; border-radius: 8px; overflow: visible; cursor: pointer; position: relative; transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); border: 2px solid transparent; min-width: 140px; max-width: 140px; scroll-snap-align: start; display: flex; flex-direction: column; }
        .numbered-item .media-card { background: transparent; overflow: visible; border-radius: 8px;}
        .media-card:hover { transform: translateY(-8px) scale(1.05); border-color: white; box-shadow: 0 15px 35px rgba(0,0,0,0.9); z-index: 10; }
        .img-container { width: 100%; aspect-ratio: 2/3; position: relative; background: #121214; border-radius: 6px; overflow: hidden; }
        .media-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }

        /* CARDS QUADRADOS PARA CANAIS AO VIVO */
        .media-card.is-live { min-width: 150px; max-width: 150px; background: #18181b; border-radius: 12px; border: 1px solid var(--border-light); padding: 12px; }
        .media-card.is-live .img-container { aspect-ratio: 1 / 1; background: #000; border-radius: 8px; padding: 15px; width: 100%; display: flex; align-items: center; justify-content: center;}
        .media-card.is-live img { width: 100%; height: 100%; object-fit: contain; } 
        .media-card.is-live .card-info { padding: 12px 5px 5px 5px; text-align: center; align-items: center; }

        /* CARDS 16:9 (Continuar Assistindo) */
        .media-card.is-16x9 { min-width: 240px; max-width: 240px; background: var(--bg-card); }
        .media-card.is-16x9 .img-container { aspect-ratio: 16 / 9; border-radius: 8px 8px 0 0; }

        .progress-bar-bg { width: 100%; height: 4px; background: rgba(255,255,255,0.2); position: absolute; bottom: 0; left: 0; z-index: 5;}
        .progress-bar-fill { height: 100%; background: var(--text-main); transition: width 0.3s; }
        
        .btn-fav { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.6); border: none; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(4px); transition: 0.2s; cursor: pointer; }
        .btn-fav svg { width: 14px; height: 14px; fill: none; stroke: white; stroke-width: 2; transition: 0.2s; }
        .btn-fav:hover svg { transform: scale(1.1); }
        .btn-fav.is-fav svg { fill: var(--star-active); stroke: var(--star-active); }
        
        .card-info { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
        .card-title { font-size: 13px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text-muted); line-height: 1.4; transition: 0.2s;}
        .media-card:hover .card-title { color: white; }

        /* LAYOUT GRADE E LISTAS DE CANAIS */
        #grid-view { padding: 40px 60px; }
        .grid-header { margin-bottom: 30px; font-size: 24px; font-weight: 700; color: white; display: none; }
        #media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; row-gap: 30px; }
        
        .live-channel-row { display: flex; align-items: center; background: var(--bg-card); padding: 10px 15px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; position: relative; }
        .live-channel-row:hover { background: #27272a; transform: translateX(5px); }
        .live-channel-row.selected { border-left: 4px solid white; background: rgba(255, 255, 255, 0.05); }
        .live-channel-row img { width: 45px; height: 45px; object-fit: contain; border-radius: 6px; margin: 0 15px; background: #000; flex-shrink: 0; }
        .live-channel-info { flex-grow: 1; min-width: 0; }
        .live-channel-name { font-size: 14px; font-weight: 600; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* MODAL DE PERFIL (ANTIGO CONFIG) */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 400; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #18181b; border-radius: 16px; padding: 30px; width: 90%; max-width: 350px; border: 1px solid var(--border-light); text-align: center; position: relative; }
        .modal-header-icon { background: rgba(59, 130, 246, 0.2); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; }
        .modal-header-icon svg { width: 40px; height: 40px; fill: var(--accent); }
        .modal-title { font-size: 22px; font-weight: bold; color: white; margin-bottom: 5px; }
        .modal-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 25px; }
        .btn-modal { background: var(--event-color); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-modal:hover { filter: brightness(1.2); }
        .btn-modal-secondary { background: transparent; color: white; border: 1px solid var(--border-light); margin-top: 10px; }
        .btn-modal-secondary:hover { background: rgba(255,255,255,0.1); }

        /* DETAIL VIEW */
        #media-detail { z-index: 100; padding: 0; background: var(--bg-base); }
        .md-bg-blur { position: absolute; inset: 0; height: 100vh; background-size: cover; background-position: top center; opacity: 0.3; mask-image: linear-gradient(to bottom, black 0%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 100%); filter: blur(10px); transition: background-image 0.5s ease; }
        .md-content { position: relative; z-index: 2; padding: 60px; min-height: 100%; display: flex; flex-direction: column; }
        .btn-close { position: absolute; top: 40px; right: 60px; background: rgba(255,255,255,0.1); border-radius: 50%; border: none; color: white; width: 44px; height: 44px; cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 200; }
        .btn-close:hover { background: white; color: black; }
        .btn-close svg { width: 24px; height: 24px; fill: currentColor; }

        .md-top-section { display: flex; gap: 50px; align-items: stretch; margin-top: 40px; }
        .md-poster { width: 280px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); object-fit: cover; aspect-ratio: 2/3; }
        .md-info { flex: 1; max-width: 800px; display: flex; flex-direction: column; justify-content: center; }
        
        .md-logo { max-width: 350px; max-height: 120px; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8)); }
        
        .md-meta { font-size: 14px; color: #a1a1aa; display: flex; gap: 15px; font-weight: 500; flex-wrap: wrap; margin-bottom: 20px;}
        .md-desc { font-size: 16px; color: #d4d4d8; line-height: 1.6; margin-bottom: 20px;}
        
        .md-actions { display: flex; gap: 15px; margin-top: 10px; align-items: center;}
        .btn-play-main { background: white; color: black; border: none; padding: 14px 35px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .btn-play-main:hover { transform: scale(1.05); }
        
        .btn-fav-main { background: transparent; color: white; border: 2px solid rgba(255,255,255,0.2); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; padding: 0; }
        .btn-fav-main svg { width: 22px; height: 22px; fill: transparent; stroke: currentColor; stroke-width: 2; transition: 0.2s; }
        .btn-fav-main:hover { border-color: white; transform: scale(1.05); }
        .btn-fav-main.is-fav { border-color: var(--star-active); color: var(--star-active); }
        .btn-fav-main.is-fav svg { fill: var(--star-active); stroke: var(--star-active); }

        /* SERIES EPISODES */
        .series-layout { display: flex; gap: 40px; margin-top: 30px; align-items: flex-start; }
        .seasons-sidebar { width: 200px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .season-btn { padding: 12px 20px; background: transparent; color: var(--text-muted); border-radius: 8px; cursor: pointer; text-align: left; font-weight: 600; font-size: 15px; transition: 0.2s; border: 1px solid transparent; }
        .season-btn:hover { color: white; background: rgba(255,255,255,0.05); }
        .season-btn.active { background: white; color: black; }

        .episodes-list { flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }
        .episode-row-card { display: flex; background: var(--bg-card); border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.2s; border: 1px solid transparent; }
        .episode-row-card:hover { border-color: rgba(255,255,255,0.3); background: #27272a; transform: translateX(5px); }
        .ep-row-img { width: 220px; min-width: 220px; aspect-ratio: 16/9; background: #000; position: relative; }
        .ep-row-img img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .ep-row-info { padding: 20px; display: flex; flex-direction: column; justify-content: center; flex-grow: 1; }
        .ep-row-title { font-size: 16px; font-weight: 700; color: white; margin-bottom: 6px; }
        .ep-row-desc { font-size: 13px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
        .ep-play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; background: rgba(0,0,0,0.5); }
        .episode-row-card:hover .ep-play-overlay { opacity: 1; }
        .ep-play-overlay svg { width: 40px; height: 40px; fill: white; }

        /* PLAYER OVERLAY */
        #player-wrapper { display: none; position: absolute; inset: 0; background: #000; z-index: 2000; flex-direction: column; }
        #btn-fechar-player { position: absolute; top: 30px; left: 30px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; z-index: 2100; display: flex; align-items: center; gap: 8px; font-weight: bold; backdrop-filter: blur(5px); }
        #btn-fechar-player:hover { background: white; color: black; }

        #global-loader { position: absolute; inset: 0; background: var(--bg-base); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); }
        .spinner-large { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-left-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <div class="logo"><img src="icon.svg">Meu<span>IPTV</span></div>
            <p>Conecte-se usando as credenciais do seu provedor</p>
            
            <div class="login-input-group">
                <label>Nome do Perfil</label>
                <input type="text" id="login-profile" class="login-input" placeholder="Ex: Minha TV, Casa">
            </div>
            <div class="login-input-group">
                <label>DNS / URL do Servidor</label>
                <input type="text" id="login-dns" class="login-input" placeholder="http://dominio.com">
            </div>
            <div class="login-input-group">
                <label>Usuário</label>
                <input type="text" id="login-user" class="login-input" placeholder="Seu usuário da lista">
            </div>
            <div class="login-input-group">
                <label>Senha</label>
                <input type="password" id="login-pass" class="login-input" placeholder="Sua senha da lista">
            </div>
            
            <button id="btn-login" class="btn-login">
                Entrar e Sincronizar
            </button>
        </div>
    </div>

    <nav id="left-nav">
        <button class="nav-icon" id="btn-search" title="Buscar">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
        <button class="nav-icon" id="btn-profile" title="Configurações e API">

                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                Sair da Conta
            </button>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
        
        let credenciais = { host: '', user: '', pass: '' };
        let abaAtiva = 'home';
        let currentCatId = null;
        let lastViewBeforePlayer = 'home';
        
        let db = { live: [], vod: [], series: [] };
        let cats = { live: [], vod: [], series: [] };
        let catMaps = { live: {}, vod: {}, series: {} };
        let dataLoaded = false;
        let bannerInterval = null;
        
        let mediaAtivaObj = null;

        // PROTEÇÃO E INICIALIZAÇÃO DO LOCAL STORAGE DE FAVORITOS
        let savedFavs = JSON.parse(localStorage.getItem('iptv_api_favs_v3'));
        if (!savedFavs || Array.isArray(savedFavs) || !savedFavs.live) {
            savedFavs = { live: [], vod: [], series: [] };
        }
        let favoritos = savedFavs;

        let historicoAssistidos = JSON.parse(localStorage.getItem('iptv_api_history')) || {};
        let videoEmReproducao = null;

        const player = videojs('my-video');
        const livePlayer = videojs('live-mini-video');
        
        const getFallbackSvg = (tipo) => `data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='300'%3E%3Crect width='100%25' height='100%25' fill='%23121214'/%3E%3Ctext x='50%25' y='50%25' fill='%233f3f46' font-family='sans-serif' font-size='20' font-weight='bold' text-anchor='middle' dy='.3em'%3E${tipo}%3C/text%3E%3C/svg%3E`;
        const imagensQuebradas = new Set();
        
        window.marcarImagemQuebrada = function(imgElement, fallbackSvg) {
            const originalUrl = imgElement.getAttribute('data-original');
            if (originalUrl) imagensQuebradas.add(originalUrl);
            imgElement.onerror = null;
            imgElement.src = fallbackSvg;
        };

        // --- TMDB API INTEGRAÇÃO ---
        async function buscarTMDB(nomeOriginal, tipo) {
            const apiKey = 'c5ec5dbd66ea50ce62b096dca322543c';
            const endpoint = tipo === 'series' ? 'tv' : 'movie';
            
            let nomeLimpo = nomeOriginal
                .replace(/\[.*?\]|\(.*?\)/g, '') 
                .split('-')[0] 
                .replace(/4K|FHD|HD|UHD|VOD|Dublado|Legendado|Dual|Audio/gi, '') 
                .trim();
                
            if(!nomeLimpo) return null;
                
            let searchUrl = `https://api.themoviedb.org/3/search/${endpoint}?api_key=${apiKey}&query=${encodeURIComponent(nomeLimpo)}&language=pt-BR`;
            
            try {
                const res = await fetch(searchUrl);
                const data = await res.json();
                
                if (data.results && data.results.length > 0) {
                    const result = data.results[0];
                    let logoUrl = null;
                    const imagesUrl = `https://api.themoviedb.org/3/${endpoint}/${result.id}/images?api_key=${apiKey}&include_image_language=pt,en,null`;
                    const imgRes = await fetch(imagesUrl);
                    const imgData = await imgRes.json();
                    
                    if (imgData.logos && imgData.logos.length > 0) {
                        logoUrl = `https://image.tmdb.org/t/p/w500${imgData.logos[0].file_path}`;
                    }
                    
                    return {
                        id: result.id,
                        titulo: result.title || result.name,
                        sinopse: result.overview,
                        nota: result.vote_average ? result.vote_average.toFixed(1) : null,
                        backdrop: result.backdrop_path ? `https://image.tmdb.org/t/p/original${result.backdrop_path}` : null,
                        poster: result.poster_path ? `https://image.tmdb.org/t/p/w500${result.poster_path}` : null,
                        logo: logoUrl,
                        ano: result.release_date ? result.release_date.substring(0, 4) : (result.first_air_date ? result.first_air_date.substring(0, 4) : '')
                    };
                }
            } catch (e) { console.error("Erro TMDB:", e); }
            return null;
        }

        /* INICIALIZAÇÃO E LÓGICA DE LOGIN */
        const loginScreen = document.getElementById('login-screen');
        const profileModal = document.getElementById('profile-modal');
        
        window.onload = () => {
            const savedUser = localStorage.getItem('iptv_user');
            const savedDns = localStorage.getItem('iptv_dns');
            const savedPass = localStorage.getItem('iptv_pass');
            
            if (savedUser && savedDns && savedPass) {
                // Usuário já está logado
                credenciais.host = savedDns;
                credenciais.user = savedUser;
                credenciais.pass = savedPass;
                loginScreen.style.display = 'none';
                carregarCatalogoCompleto();
            } else {
                // Não está logado
                loginScreen.style.display = 'flex';
            }
        };

        // Lógica de Sair (Logout)
        document.getElementById('btn-profile').addEventListener('click', () => {
            document.getElementById('modal-profile-name').textContent = localStorage.getItem('iptv_profile') || 'Meu Perfil';
            document.getElementById('modal-profile-user').textContent = localStorage.getItem('iptv_user');
            profileModal.style.display = 'flex';
        });

        document.getElementById('btn-close-modal').addEventListener('click', () => { profileModal.style.display = 'none'; });
        profileModal.addEventListener('click', (e) => { if(e.target === profileModal) profileModal.style.display = 'none'; });

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('iptv_user');
            localStorage.removeItem('iptv_pass');
            localStorage.removeItem('iptv_dns');
            localStorage.removeItem('iptv_profile');
            window.location.reload();
        });

        // Lógica do Botão Entrar
        document.getElementById('btn-login').addEventListener('click', () => {
            let dns = document.getElementById('login-dns').value.trim();
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const profile = document.getElementById('login-profile').value.trim() || 'Minha TV';

            if (!dns || !user || !pass) {
                alert("Por favor, preencha todos os campos obrigatórios (DNS, Usuário e Senha).");
                return;
            }

            // Tratamento de segurança para o DNS
            if (!dns.startsWith('http')) dns = 'http://' + dns;
            if (dns.endsWith('/')) dns = dns.slice(0, -1);

            // Salva e Sincroniza
            localStorage.setItem('iptv_profile', profile);
            localStorage.setItem('iptv_dns', dns);
            localStorage.setItem('iptv_user', user);
            localStorage.setItem('iptv_pass', pass);
            
            credenciais.host = dns;
            credenciais.user = user;
            credenciais.pass = pass;

            loginScreen.style.display = 'none';
            carregarCatalogoCompleto();
        });

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function forcarFechamentoPlayer() {
            if (document.getElementById('player-wrapper').style.display === 'flex') {
                player.pause();
                document.getElementById('player-wrapper').style.display = 'none';
                videoEmReproducao = null;
            }
            if (livePlayer) livePlayer.pause();
        }

        document.getElementById('btn-search').addEventListener('click', () => {
            if (abaAtiva === 'home') document.querySelector('.tab-btn[data-tab="vod"]').click();
            document.getElementById('search-box').focus();
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                forcarFechamentoPlayer();
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                abaAtiva = e.currentTarget.getAttribute('data-tab');
                document.getElementById('search-box').value = '';
                document.getElementById('grid-header').style.display = 'none';
                currentCatId = null;

                if (abaAtiva === 'home') {
                    document.getElementById('sidebar').classList.add('hidden');
                    if (dataLoaded) renderizarHome();
                    switchView('home-view');
                } else {
                    document.getElementById('sidebar').classList.remove('hidden');
                    if (dataLoaded) {
                        renderizarCategoriasLista(cats[abaAtiva]);
                        switchView('grid-view');
                    }
                }
            });
        });

        async function fetchAPI(action, params = '') {
            const targetUrl = `${credenciais.host}/player_api.php?username=${credenciais.user}&password=${credenciais.pass}&action=${action}${params}`;
            let proxyUrl = "";
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                proxyUrl = `http://localhost:8000/api/proxy?url=${encodeURIComponent(targetUrl)}`;
            } else {
                proxyUrl = `/api/proxy?url=${encodeURIComponent(targetUrl)}`;
            }
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('Erro na rede');
            return await response.json();
        }

        async function carregarCatalogoCompleto() {
            document.getElementById('global-loader').style.display = 'flex';
            try {
                const [cLive, sLive, cVod, sVod, cSeries, sSeries] = await Promise.all([
                    fetchAPI('get_live_categories'), fetchAPI('get_live_streams'),
                    fetchAPI('get_vod_categories'), fetchAPI('get_vod_streams'),
                    fetchAPI('get_series_categories'), fetchAPI('get_series')
                ]);
                
                cats.live = cLive; db.live = sLive;
                cats.vod = cVod; db.vod = sVod;
                cats.series = cSeries; db.series = sSeries;
                
                cLive.forEach(c => catMaps.live[c.category_id] = c.category_name);
                cVod.forEach(c => catMaps.vod[c.category_id] = c.category_name);
                cSeries.forEach(c => catMaps.series[c.category_id] = c.category_name);
                
                dataLoaded = true;
                document.getElementById('global-loader').style.display = 'none';
                
                if(abaAtiva === 'home') renderizarHome();
                else {
                    document.getElementById('sidebar').classList.remove('hidden');
                    renderizarCategoriasLista(cats[abaAtiva]);
                    switchView('grid-view');
                }
            } catch (err) {
                document.getElementById('global-loader').style.display = 'none';
                alert("Falha ao baixar o catálogo. Verifique suas credenciais ou seu Proxy Vercel.");
                // Em caso de erro grave, volta para o login para ele checar
                loginScreen.style.display = 'flex';
            }
        }

        function setupBanners() {
            const sliderContainer = document.getElementById('hero-slider');
            sliderContainer.innerHTML = '';
            
            let lancamentoCat = cats.vod.find(c => {
                const n = c.category_name.toLowerCase();
                return n.includes('lançamento') || n.includes('lancamento') || n.includes('novo');
            });
            
            let bannerStreams = lancamentoCat ? db.vod.filter(s => s.category_id == lancamentoCat.category_id).slice(0, 10) : db.vod.slice(0, 10);
            if(bannerStreams.length === 0) return;

            const dotsContainer = document.createElement('div');
            dotsContainer.className = 'slider-controls';
            
            bannerStreams.forEach((item, index) => {
                const slideId = `hero-slide-${item.stream_id || index}`;
                const slide = document.createElement('div');
                slide.className = `hero-slide ${index === 0 ? 'active' : ''}`;
                slide.id = slideId;
                const cover = item.cover || item.stream_icon || getFallbackSvg('Mídia');
                
                slide.innerHTML = `
                    <div class="hero-bg" style="background-image: url('${cover}'); filter: blur(10px) brightness(0.4);"></div>
                    <div class="hero-overlay-gradient"></div>
                    <div class="hero-content">
                        <div class="hero-title-container">
                            <h1 class="hero-title">${item.name}</h1>
                        </div>
                        <p class="hero-tagline" style="margin-bottom: 20px; font-size: 16px; color: #d4d4d8; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">Carregando informações...</p>
                        <div class="hero-meta-row">
                            <span class="hero-meta-badge tmdb-nota-badge" style="display:none;"><span class="tmdb-icon">TMDB</span> <span class="tmdb-nota-valor"></span></span>
                            <span class="hero-meta-badge tmdb-year-badge" style="display:none;"></span>
                            <span class="hero-meta-badge">${catMaps.vod[item.category_id] || "Filme"}</span>
                        </div>
                        <button class="btn-play-main" onclick="event.stopPropagation(); abrirDetalhesMedia(${item.stream_id}, 'vod')" style="width: fit-content; background: white; color: black; border-radius: 8px; padding: 12px 25px; margin-top: 10px;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="margin-right:5px;"><path d="M8 5v14l11-7z"/></svg> Mais Informações
                        </button>
                    </div>
                `;
                slide.onclick = () => abrirDetalhesMedia(item.stream_id, 'vod');
                sliderContainer.appendChild(slide);
                
                const dot = document.createElement('div');
                dot.className = `dot ${index === 0 ? 'active' : ''}`;
                dotsContainer.appendChild(dot);
                
                buscarTMDB(item.name, 'vod').then(tmdb => {
                    if(tmdb) {
                        const el = document.getElementById(slideId);
                        if(!el) return;
                        
                        if(tmdb.backdrop) {
                            const bgEl = el.querySelector('.hero-bg');
                            bgEl.style.backgroundImage = `url('${tmdb.backdrop}')`;
                            bgEl.style.filter = "brightness(0.6)"; 
                        }
                        
                        if(tmdb.logo) {
                            el.querySelector('.hero-title-container').innerHTML = `<img src="${tmdb.logo}" class="hero-logo" alt="${tmdb.titulo}">`;
                        } else {
                            el.querySelector('.hero-title').textContent = tmdb.titulo;
                        }
                        
                        if(tmdb.sinopse) el.querySelector('.hero-tagline').textContent = tmdb.sinopse;
                        
                        if(tmdb.nota) {
                            el.querySelector('.tmdb-nota-badge').style.display = 'flex';
                            el.querySelector('.tmdb-nota-valor').textContent = tmdb.nota;
                        }
                        if(tmdb.ano) {
                            el.querySelector('.tmdb-year-badge').style.display = 'flex';
                            el.querySelector('.tmdb-year-badge').textContent = tmdb.ano;
                        }
                    }
                });
            });
            sliderContainer.appendChild(dotsContainer);
            
            let currentIdx = 0;
            if(bannerInterval) clearInterval(bannerInterval);
            bannerInterval = setInterval(() => {
                const slides = sliderContainer.querySelectorAll('.hero-slide');
                const dots = sliderContainer.querySelectorAll('.dot');
                if(slides.length === 0) return;
                slides[currentIdx].classList.remove('active');
                dots[currentIdx].classList.remove('active');
                currentIdx = (currentIdx + 1) % slides.length;
                slides[currentIdx].classList.add('active');
                dots[currentIdx].classList.add('active');
            }, 8000);
        }

        function renderizarHome() {
            setupBanners();
            const homeContent = document.getElementById('home-content');
            homeContent.innerHTML = '<div class="home-content-wrapper"></div>';
            const wrapper = homeContent.querySelector('.home-content-wrapper');
            
            let lancamentoCat = cats.vod.find(c => c.category_name.toLowerCase().includes('lançamento') || c.category_name.toLowerCase().includes('novo'));
            let lancamentos = lancamentoCat ? db.vod.filter(s => s.category_id == lancamentoCat.category_id).slice(0, 10) : db.vod.slice(0, 10);
            if (lancamentos.length > 0) criarFileira(wrapper, 'Top Lançamentos da Semana', lancamentos, 'vod', false, false, true); 
            
            const favCanais = db.live.filter(s => favoritos.live.includes(s.stream_id));
            if (favCanais.length > 0) criarFileira(wrapper, 'Seus Canais Favoritos', favCanais, 'live', false, false, false); 
            
            const histFilmes = Object.values(historicoAssistidos).filter(i => i.aba === 'vod').sort((a,b) => b.timestamp - a.timestamp);
            if (histFilmes.length > 0) criarFileira(wrapper, 'Continuar Assistindo (Filmes)', histFilmes, 'vod', false, true, false); 
            
            const histSeries = Object.values(historicoAssistidos).filter(i => i.aba === 'series').sort((a,b) => b.timestamp - a.timestamp);
            if (histSeries.length > 0) criarFileira(wrapper, 'Continuar Assistindo (Séries)', histSeries, 'series', false, true, false); 
        }

        function criarFileira(container, titulo, itens, tipoAba, isEvent = false, isHistory = false, isNumbered = false) {
            const rowWrapper = document.createElement('div');
            rowWrapper.className = 'home-row';
            
            rowWrapper.innerHTML = `
                <h3>${titulo}</h3>
                <div class="scroller-container">
                    <button class="scroll-btn left-btn hidden-btn" aria-label="Rolar para esquerda">
                        <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
                    </button>
                    
                    <div class="row-scroller ${isNumbered ? 'numbered-scroller' : ''}"></div>
                    
                    <button class="scroll-btn right-btn hidden-btn" aria-label="Rolar para direita">
                        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
                    </button>
                </div>
            `;
            
            const scroller = rowWrapper.querySelector('.row-scroller');
            const btnLeft = rowWrapper.querySelector('.left-btn');
            const btnRight = rowWrapper.querySelector('.right-btn');
            
            btnLeft.onclick = () => { scroller.scrollBy({ left: -600, behavior: 'smooth' }); };
            btnRight.onclick = () => { scroller.scrollBy({ left: 600, behavior: 'smooth' }); };
            
            itens.slice(0, 20).forEach((item, index) => {
                const card = gerarHTMLCard(item, tipoAba, isEvent, isHistory);
                card.addEventListener('click', () => {
                    if (isHistory) abrirPlayer(item.url, item);
                    else if (tipoAba === 'live') {
                        document.querySelector('.tab-btn[data-tab="live"]').click();
                        setTimeout(() => {
                            const canalRow = document.querySelector(`.live-channel-row[data-id="${item.stream_id}"]`);
                            if(canalRow) canalRow.click();
                        }, 300);
                    } else {
                        const id = tipoAba === 'series' ? item.series_id : item.stream_id;
                        abrirDetalhesMedia(id, tipoAba);
                    }
                });
                
                if (isNumbered) {
                    const numberWrap = document.createElement('div');
                    numberWrap.className = 'numbered-item';
                    numberWrap.innerHTML = `<div class="huge-number">${index + 1}</div>`;
                    numberWrap.appendChild(card);
                    scroller.appendChild(numberWrap);
                } else scroller.appendChild(card);
            });
            container.appendChild(rowWrapper);

            // Controle inteligente das setas
            const updateArrows = () => {
                if (scroller.scrollWidth <= scroller.clientWidth) {
                    btnLeft.classList.add('hidden-btn');
                    btnRight.classList.add('hidden-btn');
                } else {
                    if (scroller.scrollLeft <= 10) btnLeft.classList.add('hidden-btn');
                    else btnLeft.classList.remove('hidden-btn');
                    
                    if (scroller.scrollLeft + scroller.clientWidth >= scroller.scrollWidth - 10) btnRight.classList.add('hidden-btn');
                    else btnRight.classList.remove('hidden-btn');
                }
            };

            setTimeout(updateArrows, 150);
            scroller.addEventListener('scroll', updateArrows);
            window.addEventListener('resize', updateArrows);
        }

        // --- SISTEMA INTELIGENTE PARA ATUALIZAR CONTADOR DE FAVORITOS ---
        function updateFavBadge(tipoAbaAtualizado) {
            if (abaAtiva === tipoAbaAtualizado && abaAtiva !== 'home') {
                const favBadge = document.querySelector('.cat-fav .badge-count');
                if (favBadge) favBadge.textContent = favoritos[tipoAbaAtualizado].length;
            }
        }

        function renderizarCategoriasLista(categorias) {
            const listUI = document.getElementById('category-list');
            listUI.innerHTML = '';
            let htmlList = '';
            const historicoDaAba = abaAtiva !== 'live' ? Object.values(historicoAssistidos).filter(item => item.aba === abaAtiva) : [];
            if (abaAtiva !== 'live' && historicoDaAba.length > 0) htmlList += `<li class="cat-history" data-id="history" style="color:var(--history-color)">Continuar Assistindo <span class="badge-count">${historicoDaAba.length}</span></li>`;
            
            const contagemFavAtual = favoritos[abaAtiva] ? favoritos[abaAtiva].length : 0;
            htmlList += `<li class="cat-fav" data-id="fav" style="color:var(--star-active)">Favoritos <span class="badge-count">${contagemFavAtual}</span></li>`;
            categorias.forEach(cat => { htmlList += `<li data-id="${cat.category_id}">${cat.category_name}</li>`; });
            listUI.innerHTML = htmlList;
            
            const items = listUI.querySelectorAll('li');
            items.forEach(li => {
                li.addEventListener('click', () => {
                    forcarFechamentoPlayer();
                    items.forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    
                    const id = li.getAttribute('data-id');
                    document.getElementById('search-box').value = ''; 
                    document.getElementById('grid-header').style.display = 'none';
                    switchView('grid-view');
                    
                    if (id === 'history') { currentCatId = 'history'; renderizarGrade(historicoDaAba.sort((a, b) => b.timestamp - a.timestamp), abaAtiva, false, true); } 
                    else if (id === 'fav') { currentCatId = 'fav'; renderizarGrade(db[abaAtiva].filter(item => favoritos[abaAtiva].includes(item.stream_id || item.series_id)), abaAtiva, false); } 
                    else { currentCatId = id; renderizarGrade(db[abaAtiva].filter(item => String(item.category_id) === String(id)), abaAtiva, false); }
                });
            });
            
            const catParaRestaurar = listUI.querySelector(`li[data-id="${currentCatId}"]`) || listUI.querySelector(`li:nth-child(3)`);
            if (catParaRestaurar) catParaRestaurar.click();
        }

        // --- SISTEMA INTELIGENTE DE FAVORITOS ---
        function toggleFav(event, id, tipoAba) {
            event.stopPropagation();
            const btn = event.currentTarget;
            
            if (favoritos[tipoAba].includes(id)) {
                favoritos[tipoAba] = favoritos[tipoAba].filter(f => f !== id);
                btn.classList.remove('is-fav');
            } else {
                favoritos[tipoAba].push(id);
                btn.classList.add('is-fav');
            }
            localStorage.setItem('iptv_api_favs_v3', JSON.stringify(favoritos));
            
            updateFavBadge(tipoAba);

            if (abaAtiva === 'home') {
                renderizarHome(); 
            } else if (currentCatId === 'fav' && abaAtiva === tipoAba) {
                const element = document.querySelector(`[data-id="${id}"]`) || btn.closest('.media-card, .live-channel-row');
                if (element && !favoritos[tipoAba].includes(id)) {
                    element.remove();
                }
            }
        }

        function toggleFavoritoMediaDetail() {
            if(!mediaAtivaObj) return;
            const id = mediaAtivaObj.id; 
            const tipoAba = mediaAtivaObj.tipo;
            
            if (favoritos[tipoAba].includes(id)) favoritos[tipoAba] = favoritos[tipoAba].filter(f => f !== id);
            else favoritos[tipoAba].push(id);
            
            localStorage.setItem('iptv_api_favs_v3', JSON.stringify(favoritos));
            atualizarBotaoFavDetail();
            
            updateFavBadge(tipoAba);

            if (abaAtiva !== 'home') {
                if (currentCatId === 'fav' && abaAtiva === tipoAba) {
                    const favStreams = db[abaAtiva].filter(item => favoritos[abaAtiva].includes(item.stream_id || item.series_id));
                    renderizarGrade(favStreams, abaAtiva, false);
                }
            }
        }

        function atualizarBotaoFavDetail() {
            const btn = document.getElementById('btn-fav-main');
            const isFav = favoritos[mediaAtivaObj.tipo].includes(mediaAtivaObj.id);
            
            if(isFav) {
                btn.classList.add('is-fav');
                btn.setAttribute('title', 'Remover dos Favoritos');
            } else {
                btn.classList.remove('is-fav');
                btn.setAttribute('title', 'Adicionar aos Favoritos');
            }
        }

        function gerarHTMLCard(item, tipoAba, isEventLayout, isHistoryView) {
            const id = item.stream_id || item.series_id || item.id; 
            const nome = item.name;
            const logo = item.stream_icon || item.cover || item.logo;
            const fallbackImg = tipoAba === 'live' ? getFallbackSvg('TV') : getFallbackSvg('Poster');
            const srcFinal = (logo && !imagensQuebradas.has(logo)) ? logo : fallbackImg;
            const isFav = favoritos[tipoAba] && favoritos[tipoAba].includes(id);
            
            const card = document.createElement('div');
            card.setAttribute('data-id', id);
            
            let extraClass = '';
            if (tipoAba === 'live') extraClass = 'is-live';
            else if (isHistoryView) extraClass = 'is-16x9';
            
            card.className = `media-card ${extraClass}`;
            
            let progressBar = '';
            if (isHistoryView && item.percent) {
                progressBar = `<div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${item.percent * 100}%"></div></div>`;
            }
            
            card.innerHTML = `
                <div class="img-container">
                    <button class="btn-fav ${isFav ? 'is-fav' : ''}" onclick="toggleFav(event, ${id}, '${tipoAba}')">
                        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </button>
                    <img src="${srcFinal}" data-original="${logo}" onerror="marcarImagemQuebrada(this, '${fallbackImg}')" loading="lazy">
                    ${progressBar}
                </div>
                <div class="card-info">
                    <span class="card-title" title="${nome}">${nome}</span>
                </div>
            `;
            return card;
        }

        function renderizarGrade(dados, tipoAba, isEventLayout = false, isHistoryView = false) {
            const gridUI = document.getElementById('media-grid');
            const liveContainer = document.getElementById('live-layout-container');
            const liveListUI = document.getElementById('live-channels-list');
            
            gridUI.innerHTML = ''; liveListUI.innerHTML = '';
            
            if (tipoAba === 'live') {
                gridUI.style.display = 'none';
                liveContainer.style.display = 'flex';
                if(dados.length === 0) { liveListUI.innerHTML = '<div style="padding: 20px; color: var(--text-muted);">Nenhum canal encontrado.</div>'; return; }
                
                dados.forEach(item => {
                    const id = item.stream_id || item.id;
                    const srcFinal = (item.stream_icon && !imagensQuebradas.has(item.stream_icon)) ? item.stream_icon : getFallbackSvg('TV');
                    const isFav = favoritos.live && favoritos.live.includes(id);

                    const row = document.createElement('div');
                    row.className = 'live-channel-row';
                    row.setAttribute('data-id', id);
                    row.innerHTML = `
                        <button class="btn-fav ${isFav ? 'is-fav' : ''}" onclick="toggleFav(event, ${id}, 'live')" style="position: static; width: 28px; height: 28px; margin-right: 10px;">
                            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                        </button>
                        <img src="${srcFinal}" onerror="marcarImagemQuebrada(this, '${getFallbackSvg('TV')}')" loading="lazy">
                        <div class="live-channel-info"><div class="live-channel-name">${item.name}</div></div>
                    `;
                    
                    row.addEventListener('click', () => {
                        document.querySelectorAll('.live-channel-row').forEach(el => el.classList.remove('selected'));
                        row.classList.add('selected');
                        const playUrl = `${credenciais.host}/live/${credenciais.user}/${credenciais.pass}/${id}.${item.container_extension || 'm3u8'}`;
                        livePlayer.src({ src: playUrl.replace('.ts', '.m3u8'), type: 'application/x-mpegURL' });
                        livePlayer.play().catch(e => console.error(e));
                        carregarEPGCanal(id);
                    });
                    liveListUI.appendChild(row);
                });
            } else {
                liveContainer.style.display = 'none';
                gridUI.style.display = 'grid';
                dados.slice(0, 500).forEach(item => {
                    const card = gerarHTMLCard(item, tipoAba, false, isHistoryView);
                    card.addEventListener('click', () => {
                        if (isHistoryView) abrirPlayer(item.url, item);
                        else abrirDetalhesMedia(item.stream_id || item.series_id || item.id, tipoAba);
                    });
                    gridUI.appendChild(card);
                });
            }
        }

        async function carregarEPGCanal(streamId) {
            const epgContent = document.getElementById('live-epg-content');
            epgContent.innerHTML = 'Carregando EPG...';
            try {
                const data = await fetchAPI('get_short_epg', `&stream_id=${streamId}`);
                if (data && data.epg_listings && data.epg_listings.length > 0) {
                    let htmlElements = '';
                    data.epg_listings.forEach(prog => {
                        const title = decodificarStringEPG(prog.title);
                        const start = prog.start ? (prog.start.includes(' ') ? prog.start.split(' ')[1].substring(0, 5) : prog.start) : '';
                        htmlElements += `<div style="padding:10px 0; border-bottom:1px solid var(--border-light);"><strong style="color:white;">${start}</strong> - ${title}</div>`;
                    });
                    epgContent.innerHTML = htmlElements;
                } else epgContent.innerHTML = 'Nenhuma programação disponível.';
            } catch (err) { epgContent.innerHTML = 'Falha ao buscar EPG.'; }
        }

        document.getElementById('search-box').addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase();
            const gridHeader = document.getElementById('grid-header');
            if (termo === '') {
                gridHeader.style.display = 'none';
                const activeLi = document.querySelector(`#category-list li.active`);
                if (activeLi) activeLi.click(); 
            } else {
                document.querySelectorAll('#category-list li').forEach(el => el.classList.remove('active'));
                gridHeader.style.display = 'block'; gridHeader.textContent = `Resultados para "${termo}"`;
                renderizarGrade(db[abaAtiva].filter(item => item.name.toLowerCase().includes(termo)), abaAtiva, false);
            }
        });

        /* DETALHES DE MÍDIA COM INTEGRAÇÃO TMDB & NOVO LAYOUT DE SÉRIES */
        async function abrirDetalhesMedia(id, tipo) {
            document.getElementById('global-loader').style.display = 'flex';
            
            try {
                const action = tipo === 'series' ? 'get_series_info' : 'get_vod_info';
                const data = await fetchAPI(action, tipo === 'series' ? `&series_id=${id}` : `&vod_id=${id}`);
                const info = data.info;
                mediaAtivaObj = { id: id, tipo: tipo, info: info };
                
                let imgPoster = info.movie_image || info.cover || getFallbackSvg('Mídia');
                document.getElementById('md-poster').src = imgPoster;
                document.getElementById('md-blur').style.backgroundImage = `url('${imgPoster}')`;
                
                document.getElementById('md-title-container').innerHTML = `<h1 class="md-title" id="md-title">${info.name}</h1>`;
                document.getElementById('md-summary').textContent = info.plot || 'Buscando sinopse...';
                document.getElementById('md-rating').textContent = info.rating ? `${info.rating}★` : '';
                document.getElementById('md-date').textContent = info.releaseDate ? `• ${info.releaseDate}` : '';
                document.getElementById('md-cast').textContent = info.cast ? `• Elenco: ${info.cast}` : '';
                
                atualizarBotaoFavDetail();
                
                const btnPlayMain = document.getElementById('btn-play-main');
                const epSection = document.getElementById('md-episodes-section');
                
                if (tipo === 'vod') {
                    epSection.style.display = 'none';
                    const playUrl = `${credenciais.host}/movie/${credenciais.user}/${credenciais.pass}/${id}.${data.movie_data.container_extension || 'mp4'}`;
                    btnPlayMain.innerHTML = historicoAssistidos[id] ? `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="margin-right:5px;"><path d="M8 5v14l11-7z"/></svg> Continuar Assistindo` : `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="margin-right:5px;"><path d="M8 5v14l11-7z"/></svg> Assistir Agora`;
                    btnPlayMain.onclick = () => abrirPlayer(playUrl, { id: id, name: info.name, url: playUrl, aba: 'vod' });
                } else if (tipo === 'series') {
                    epSection.style.display = 'block';
                    
                    const seasonsSidebar = document.getElementById('seasons-sidebar');
                    const listUI = document.getElementById('md-episodes');
                    const temporadas = Object.keys(data.episodes);
                    
                    seasonsSidebar.innerHTML = '';
                    listUI.innerHTML = '';

                    if (temporadas.length === 0) {
                        seasonsSidebar.style.display = 'none';
                        listUI.innerHTML = '<div style="color:var(--text-muted);">Nenhum episódio encontrado.</div>';
                    } else {
                        seasonsSidebar.style.display = 'flex';
                        
                        function renderEpisodios(tNum) {
                            listUI.innerHTML = '';
                            data.episodes[tNum].forEach((ep, index) => {
                                const epPlayUrl = `${credenciais.host}/series/${credenciais.user}/${credenciais.pass}/${ep.id}.${ep.container_extension}`;
                                const epItem = document.createElement('div');
                                epItem.className = 'episode-row-card'; 
                                
                                const plot = ep.info && ep.info.plot ? ep.info.plot : (ep.info && ep.info.overview ? ep.info.overview : 'Sinopse não disponível para este episódio.');
                                const duration = ep.info && ep.info.duration ? ` • ${ep.info.duration}` : '';
                                
                                epItem.innerHTML = `
                                    <div class="ep-row-img">
                                        <img src="${ep.info.movie_image || imgPoster}" loading="lazy" onerror="this.src='${getFallbackSvg('Episódio')}';">
                                        <div class="ep-play-overlay">
                                            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                        </div>
                                    </div>
                                    <div class="ep-row-info">
                                        <div class="ep-row-title">${index + 1}. ${ep.title}</div>
                                        <div style="color: var(--accent); font-size: 12px; font-weight: bold; margin-bottom: 8px;">T${tNum} : E${ep.episode_num}${duration}</div>
                                        <div class="ep-row-desc">${plot}</div>
                                    </div>
                                `;
                                epItem.onclick = () => abrirPlayer(epPlayUrl, { id: ep.id, name: ep.title, url: epPlayUrl, aba: 'series' });
                                listUI.appendChild(epItem);
                            });
                        }

                        temporadas.forEach(tNum => {
                            const btn = document.createElement('button');
                            btn.className = 'season-btn';
                            btn.textContent = `Temporada ${tNum}`;
                            btn.onclick = () => {
                                seasonsSidebar.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
                                btn.classList.add('active');
                                renderEpisodios(tNum);
                            };
                            seasonsSidebar.appendChild(btn);
                        });
                        
                        seasonsSidebar.firstChild.classList.add('active');
                        renderEpisodios(temporadas[0]);
                        
                        btnPlayMain.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="margin-right:5px;"><path d="M8 5v14l11-7z"/></svg> Assistir Episódio 1`;
                        btnPlayMain.onclick = () => abrirPlayer(`${credenciais.host}/series/${credenciais.user}/${credenciais.pass}/${data.episodes[temporadas[0]][0].id}.${data.episodes[temporadas[0]][0].container_extension}`, {id: data.episodes[temporadas[0]][0].id, aba: 'series'});
                    }
                }
                
                document.getElementById('global-loader').style.display = 'none';
                lastViewBeforePlayer = document.querySelector('.view-section.active').id;
                switchView('media-detail');

                buscarTMDB(info.name, tipo).then(tmdb => {
                    if(tmdb) {
                        if(tmdb.poster) document.getElementById('md-poster').src = tmdb.poster;
                        if(tmdb.backdrop) document.getElementById('md-blur').style.backgroundImage = `url('${tmdb.backdrop}')`;
                        
                        const titleContainer = document.getElementById('md-title-container');
                        if(tmdb.logo) titleContainer.innerHTML = `<img src="${tmdb.logo}" class="md-logo" alt="${tmdb.titulo}">`;
                        else titleContainer.innerHTML = `<h1 class="md-title">${tmdb.titulo}</h1>`;
                        
                        if(tmdb.sinopse) document.getElementById('md-summary').textContent = tmdb.sinopse;
                        if(tmdb.nota) document.getElementById('md-rating').textContent = `${tmdb.nota}★ TMDB`;
                        if(tmdb.ano) document.getElementById('md-date').textContent = `• ${tmdb.ano}`;
                    }
                });
                
            } catch (err) { 
                document.getElementById('global-loader').style.display = 'none'; 
                alert("Erro ao carregar detalhes da mídia."); 
            }
        }

        window.fecharDetalhesMedia = function() {
            mediaAtivaObj = null;
            if (abaAtiva === 'home') switchView('home-view'); else switchView('grid-view');
        }

        function abrirPlayer(url, metadados = null) {
            if (!url) return;
            videoEmReproducao = metadados; 
            lastViewBeforePlayer = document.querySelector('.view-section.active').id;
            const wrapper = document.getElementById('player-wrapper');
            wrapper.style.display = 'flex';
            let urlCorrigida = url.toLowerCase().includes('.ts') && !url.toLowerCase().includes('/movie/') && !url.toLowerCase().includes('/series/') ? url.replace('.ts', '.m3u8') : url;
            player.src({ src: urlCorrigida, type: urlCorrigida.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4' });
            player.ready(() => { if (videoEmReproducao && historicoAssistidos[videoEmReproducao.id]) player.currentTime(historicoAssistidos[videoEmReproducao.id].currentTime); });
            player.play().catch(e => console.error(e));
        }

        player.on('timeupdate', () => {
            if (!videoEmReproducao || videoEmReproducao.aba === 'live') return;
            const currentTime = player.currentTime(); const duration = player.duration();
            if (duration && currentTime > 5) {
                const percent = currentTime / duration;
                if (percent > 0.95) delete historicoAssistidos[videoEmReproducao.id];
                else historicoAssistidos[videoEmReproducao.id] = { ...videoEmReproducao, currentTime: currentTime, duration: duration, percent: percent, timestamp: Date.now() };
                localStorage.setItem('iptv_api_history', JSON.stringify(historicoAssistidos));
            }
        });

        document.getElementById('btn-fechar-player').addEventListener('click', () => {
            player.pause(); document.getElementById('player-wrapper').style.display = 'none'; videoEmReproducao = null;
            if (lastViewBeforePlayer === 'home-view') renderizarHome();
            else if (lastViewBeforePlayer === 'media-detail' && mediaAtivaObj) abrirDetalhesMedia(mediaAtivaObj.id, mediaAtivaObj.tipo);
        });
    </script>
