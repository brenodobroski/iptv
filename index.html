<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- Preconnect: abre a conexão (DNS/TLS) com esses domínios antes de precisar deles,
         economiza uns 100-300ms em cada primeira chamada pro TMDB e pro CDN do video.js -->
    <link rel="preconnect" href="https://api.themoviedb.org">
    <link rel="preconnect" href="https://image.tmdb.org">
    <link rel="preconnect" href="https://vjs.zencdn.net">

    <title>Meu IPTV Premium</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Spinner simples enquanto o player carrega a nova fonte (loadedmetadata) */
        #player-wrapper.player-loading::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 46px; height: 46px;
            margin: -23px 0 0 -23px;
            border: 4px solid rgba(255,255,255,0.25);
            border-top-color: #ff5500;
            border-radius: 50%;
            animation: player-spin 0.8s linear infinite;
            z-index: 40;
        }
        @keyframes player-spin { to { transform: rotate(360deg); } }
        #player-wrapper { position: relative; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-glow"></div>

        <div class="login-logo">
            <img src="icon.svg" alt="Logo">
            Meu<span>IPTV</span>
        </div>

        <div class="login-form-container">
            <h2>Log In</h2>
            <p>Conecte-se usando as credenciais do seu provedor</p>
            
            <div class="login-inputs">
                <input type="text" id="login-profile" class="login-input" placeholder="Nome da Playlist (Ex: Casa)">
                
                <div class="input-with-prefix">
                    <span class="input-prefix">http://</span>
                    <input type="text" id="login-dns" class="login-input-no-bg" placeholder="dominio.com">
                </div>

                <input type="text" id="login-user" class="login-input" placeholder="Usuário">
                <input type="password" id="login-pass" class="login-input" placeholder="Senha">
            </div>
            
            <button id="btn-login" class="btn-login">Log in</button>
        </div>
    </div>

    <header id="top-nav">
        <div class="nav-left">
            <button class="nav-link active" data-tab="home">Início</button>
            <button class="nav-link" data-tab="live">Ao Vivo</button>
            <button class="nav-link" data-tab="vod">Filmes</button>
            <button class="nav-link" data-tab="series">Séries</button>
        </div>

        <div class="nav-center">
            <img src="icon.svg" alt="Logo">
            Meu<span>IPTV</span>
        </div>

        <div class="nav-right">
            <div class="search-wrapper" id="search-wrapper">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="search-box" placeholder="Buscar...">
            </div>

            <button class="icon-btn" id="btn-search" title="Buscar">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button class="icon-btn" id="btn-profile" title="Perfil">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </button>
        </div>
    </header>

    <div id="category-bar" class="hidden">
        <ul id="category-list"></ul>
    </div>

    <div id="main-area">
        <div id="home-view" class="view-section active">
            <div class="hero-slider" id="hero-slider"></div>
            <div id="home-content"></div>
        </div>
        
        <div id="grid-view" class="view-section">
            <div class="grid-header" id="grid-header" style="padding: 110px 60px 10px 60px;">Resultados</div>
            
            <div id="live-layout-container" style="display: none;">
                
                <div id="live-category-sidebar">
                    <div class="live-search">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <input type="text" id="live-search-box" placeholder="Search">
                    </div>
                    <ul id="live-category-list">
                        </ul>

                </div>

                <div id="live-channels-column">
                    <div class="live-channels-header">
                        <button id="btn-toggle-live-cats" title="Abrir Categorias">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                        </button>
                        <h3>Canais</h3>
                    </div>
                    <div id="live-channels-list"></div>
                </div>

                <div id="live-player-column">
                    <div id="miniplayer-container">
                        <video id="live-mini-video" class="video-js vjs-default-skin" controls preload="auto" style="width:100% !important; height:100% !important;"></video>
                    </div>
                    <div id="live-epg-container">
                        <div id="live-epg-content">Selecione um canal para ver a programação.</div>
                    </div>
                </div>

            </div>
            
            <div id="media-grid" style="padding: 150px 60px 40px 60px;"></div>
        </div>

        <div id="media-detail" class="view-section">
            <div class="md-bg-blur" id="md-blur"></div>
            <div class="md-content">
                <button class="btn-close" onclick="fecharDetalhesMedia()">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
                <div class="md-top-section">
                    <img id="md-poster" class="md-poster" src="" alt="Poster">
                    <div class="md-info">
                        <div id="md-title-container"><h1 class="md-title" id="md-title"></h1></div>
                        
                        <div class="md-meta" id="md-meta-container">
                            <span id="md-rating" style="color:var(--star-active); font-weight:bold;"></span> 
                            <span id="md-date"></span> 
                            <span id="md-cast"></span>
                        </div>
                        <p class="md-desc" id="md-summary"></p>
                        <div class="md-actions">
                            <button class="btn-play-main" id="btn-play-main">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="margin-right:5px;"><path d="M8 5v14l11-7z"/></svg> Assistir Agora
                            </button>
                            <button class="btn-fav-main" id="btn-fav-main" onclick="toggleFavoritoMediaDetail()" title="Adicionar aos Favoritos">
                                <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="md-episodes-section" id="md-episodes-section" style="margin-top: 50px; display: none;">
                    <h3 style="font-size: 24px; color: white; font-weight: bold; margin-bottom: 20px;">Episódios</h3>
                    <div class="series-layout">
                        <div class="seasons-sidebar" id="seasons-sidebar"></div>
                        <div class="episodes-list" id="md-episodes"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="player-wrapper">
            <button id="btn-fechar-player">
                <svg viewBox="0 0 24 24" style="width: 20px; fill: white;"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                Voltar
            </button>
            <video id="my-video" class="video-js vjs-default-skin" controls preload="auto"></video>
        </div>

        <div id="global-loader" style="display: none;">
            <div class="spinner-large"></div>
            <h2 style="color: white; font-weight: bold;">Carregando...</h2>
        </div>
    </div>

    <div id="profile-modal" class="modal-overlay">
        <div class="modal-content btn-modal-container">
            <div class="modal-header-icon">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <h2 class="modal-title" id="modal-profile-name">Perfil</h2>
            <p class="modal-subtitle" id="modal-profile-user">usuario</p>
            
            <button class="btn-modal" id="btn-logout">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                Sair da Conta
            </button>
            <button class="btn-modal btn-modal-secondary" id="btn-close-modal">Voltar</button>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
